name: Verify Alpha Beta23 Create Video

on:
  push:
    branches:
      - feature/create-video-v1
    paths:
      - "app/api/create-video/**"
      - "components/create-video-studio.tsx"
      - "lib/create-video-*.ts"
      - "scripts/apply-beta23-create-video.mjs"
      - "tests/beta23-create-video-phase1.test.mjs"
      - "start-alpha-v11.command"
      - "package.json"
      - ".github/workflows/verify-beta23-create-video.yml"
  workflow_dispatch:

jobs:
  verify-create-video-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Apply beta23 Create Video patch
        run: node scripts/apply-beta23-create-video.mjs "$PWD"

      - name: Verify beta23 patch idempotency
        run: node scripts/apply-beta23-create-video.mjs "$PWD"

      - name: Syntax check patcher
        run: node --check scripts/apply-beta23-create-video.mjs

      - name: Focused Create Video regression tests
        run: node --test tests/beta23-create-video-phase1.test.mjs

      - name: Focused TypeScript check
        shell: bash
        run: |
          set +e
          TYPECHECK_OUTPUT="$(npx tsc --noEmit 2>&1)"
          TYPECHECK_STATUS=$?
          set -e
          printf '%s\n' "$TYPECHECK_OUTPUT"
          CREATE_VIDEO_ERRORS="$(printf '%s\n' "$TYPECHECK_OUTPUT" \
            | grep -E '(^|/)(app/api/create-video|components/create-video|lib/create-video)[^:]*\.(ts|tsx)\(' \
            | grep -Ev "Cannot find module 'cloudflare:workers'|Cannot find name 'D1Database'|Cannot find name 'D1Database'. Did you mean 'IDBDatabase'" \
            || true)"
          if [[ -n "$CREATE_VIDEO_ERRORS" ]]; then
            echo "Create Video TypeScript errors detected"
            printf '%s\n' "$CREATE_VIDEO_ERRORS"
            exit 1
          fi
          if [[ $TYPECHECK_STATUS -ne 0 ]]; then
            echo "Repository has pre-existing TypeScript/Cloudflare typing errors outside Create Video; focused Create Video gate is clean."
          fi

      - name: Production build
        run: npm run build

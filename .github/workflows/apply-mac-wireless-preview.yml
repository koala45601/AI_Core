name: Apply Mac Wireless Preview

on:
  push:
    branches:
      - audit/security-agent-v1
    paths:
      - scripts/apply-mac-wireless-preview.mjs
      - .github/workflows/apply-mac-wireless-preview.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/security-agent-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/apply-mac-wireless-preview.mjs
      - name: Syntax check Tool Service
        run: node --check tool-service/server.mjs
      - name: Run focused security tests
        run: node --test tests/security-scope.test.mjs tests/security-intent.test.mjs
      - name: Commit patched preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/chat/route.ts lib/agent-tools.ts tool-service/server.mjs package.json
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Implement Mac-first wireless capability preview"
          git push origin HEAD:audit/security-agent-v1

name: Verify Alpha Beta5 Preview

on:
  push:
    branches:
      - audit/security-agent-v1
    paths:
      - 'scripts/apply-beta4-*.mjs'
      - 'scripts/apply-beta5-*.mjs'
      - 'lib/conversation-router.js'
      - 'lib/agent-run-store.ts'
      - 'app/api/tasks/**'
      - 'start-alpha-v11.command'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'tests/beta5-reasoning-runtime.test.mjs'
      - '.github/workflows/verify-beta4-preview.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/security-agent-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Apply beta3 base patch
        run: node scripts/apply-beta3-runtime-patch.mjs .
      - name: Apply beta4 runtime patches
        run: |
          node scripts/apply-beta4-shell-artifacts.mjs .
          node scripts/apply-beta4-batch-install-v2.mjs .
          node scripts/apply-beta4-tool-schema.mjs .
          node scripts/apply-beta4-chat-runtime-v2.mjs .
          node scripts/apply-beta4-loop-hardening-v2.mjs .
          node scripts/apply-beta4-task-ui-v2.mjs .
      - name: Apply beta5 adaptive reasoning
        run: node scripts/apply-beta5-adaptive-reasoning.mjs .
      - name: Syntax check host services and patchers
        run: |
          node --check tool-service/server.mjs
          node --check tool-service/server-wrapper-beta3.mjs
          node --check scripts/apply-beta4-batch-install-v2.mjs
          node --check scripts/apply-beta4-chat-runtime-v2.mjs
          node --check scripts/apply-beta4-loop-hardening-v2.mjs
          node --check scripts/apply-beta4-task-ui-v2.mjs
          node --check scripts/apply-beta5-adaptive-reasoning.mjs
      - name: Focused tests
        run: node --test tests/security-scope.test.mjs tests/context-routing.test.mjs tests/beta3-agent-runtime.test.mjs tests/beta5-reasoning-runtime.test.mjs
      - name: Build
        run: npm run build

use_default_settings: true

general:
  debug: false
  instance_name: "Alpha Search"

search:
  safe_search: 2
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "alpha-local-search-only-2026"
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0


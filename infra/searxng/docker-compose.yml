services:
  alpha-searxng:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpha-searxng-local:1.0
    container_name: alpha-searxng
    restart: "no"
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    tmpfs:
      - /etc/searxng
      - /var/cache/searxng
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
